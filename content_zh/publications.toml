[[research.sections.items]]
title = "What Reaches the Ballot? Positions, Policy Outcomes, and Partisanship in Electoral Accountability"
author = "Yao Yao"
details = "Solo-authored."
abstract = """The electoral connection links what representatives do in office to how voters judge them. Under delegation, however, the policy citizens experience reflects not only a representative’s decision but also the choices of the agency that implements the law. What, then, do voters hold a representative accountable for? Using a survey experiment embedded in the 2025 Cooperative Election Study, I find, first, that the electoral connection reaches beyond the representative’s own decision: voters also hold him accountable for the policy the agency implements. Second, the connection conveys a mixed signal: representative’s position, the implemented policy, and partisan alignment each independently shape both approval of his vote and support for his reelection. Their relative weight, however, differs. In approval, the implemented policy outweighs partisan alignment; in vote choice, partisan alignment outweighs the implemented policy. Approval and vote choice are therefore related but distinct judgments: approval of a representative’s vote does not necessarily translate into electoral reward.

The study was preregistered on AsPredicted (#266394) on January 5, 2026, after 2025 CES fielding (November 2025) but before the data were delivered to the author (March 2026)."""

